# 工作流名称（显示在 Actions 面板）
name: Simple Greeting Action

# 触发条件：1. push代码时 2. 手动触发（方便测试）
on:
  push:
    branches: [ main, master ]  # 只在推送到主分支时触发
  workflow_dispatch:  # 手动触发开关

# 定义要执行的任务
jobs:
  # 任务名称：greet-and-info
  greet-and-info:
    # 运行环境：GitHub 提供的最新 Ubuntu 虚拟机
    runs-on: ubuntu-latest
    
    # 任务的具体步骤
    steps:
      # 步骤1：拉取当前仓库的代码（必选，否则无法访问仓库文件）
      - name: Checkout repository code
        uses: actions/checkout@v4  # 使用官方的拉代码 Action

      # 步骤2：输出问候语（运行 Shell 命令）
      - name: Print greeting message
        run: echo "👋 Hello! Welcome to your first GitHub Actions workflow!"

      # 步骤3：打印仓库和触发者信息（使用 GitHub 内置环境变量）
      - name: Show repository info
        run: |
          echo "📦 Repository name: ${{ github.repository }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🔖 Event type: ${{ github.event_name }}"

      # 步骤4：输出系统环境信息（验证运行环境）
      - name: Show system info
        run: |
          echo "💻 OS version:"
          cat /etc/os-release | grep PRETTY_NAME
          echo "📌 Node version (预装):"
          node -v
          echo "📌 Python version (预装):"
          python3 -V
