name: Daily News from RSS
on:
  schedule:
    - cron: "0 1 * * *"  # 每天 UTC 1点（北京时间 9点）
  workflow_dispatch:      # 手动触发测试

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 抓取 RSS 并保存为 JSON/Markdown
      - name: Fetch RSS feed
        uses: Promptly-Technologies-LLC/rss-fetch-action@v1
        with:
          feed_url: https://feeds.bbci.co.uk/news/rss.xml  # 替换成你要的 RSS
          file_path: news/36kr-latest.json  # 保存路径
          remove_last_build_date: false

      # 可选：转成 Markdown 简报
      - name: Convert to Markdown
        run: |
          TODAY=$(date +%Y-%m-%d)
          jq -r '.entries[] | "- **\(.title)**\n  \(.link)\n  \(.summary | gsub("<[^>]*>"; ""))\n"' news/36kr-latest.json > news/$TODAY-36kr.md

      # 提交到仓库
      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add news/
          git commit -m "Add news $TODAY" || echo "No changes"
          git push
